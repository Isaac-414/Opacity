<!DOCTYPE html>
<html>
  <head>
    <style>
      img {
        opacity:0.5;
      }
    </style>
  </head>
  <body>
    <h1>Image Transparency</h1>
    <p>The opacity property specifies the transparency of an element.The lower the value,the more transparency</p>

    <P>Image with 50% opacity</P>
    <img src="img_forest.jpg" alt="Forest" width="179" height="100">
  </body>
</html>
